# Runs this repository's own GitHub Action against itself, so every pull
# request exercises the action and shows pydoctor's findings in code scanning.
name: pydoctor (self-scan)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --upgrade --upgrade-strategy eager -e .

      - name: pydoctor
        uses: ./
        with:
          version: local
          # Report findings in code scanning; the publish workflow is the gate.
          fail-on-findings: "false"
